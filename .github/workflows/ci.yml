name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Voller PEP8-Gate (Regelsatz aus pyproject.toml: E, W, F, I, N @ 100 Zeichen)
      - name: Lint (ruff)
        run: ruff check crawler demo tests docs

      - name: Tests
        run: python -m pytest
