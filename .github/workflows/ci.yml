name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Nur harte Fehler: Syntax (E9), ungültige Vergleiche/f-strings (F63),
      # kaputte Kontrollflüsse (F7), undefinierte Namen (F82).
      # Stil-Regeln bewusst NICHT erzwungen — Legacy-Code wird schrittweise sauber.
      - name: Lint (ruff — nur kritische Fehler)
        run: ruff check crawler demo tests --select E9,F63,F7,F82

      - name: Tests
        run: python -m pytest
